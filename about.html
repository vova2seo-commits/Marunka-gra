<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Великий Лабіринт для Ведмедика - Рандомні Рівні</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            font-family: 'Arial', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        #header {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        #header h2 { font-size: 32px; margin: 0 0 10px 0; }
        #levelInfo { font-size: 28px; font-weight: bold; }
        canvas {
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #FFF;
            max-width: 90vw;
            max-height: 70vh;
            display: block;
        }
        #controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            grid-template-columns: 1fr 90px 1fr;
            grid-template-rows: 1fr 90px 1fr;
            gap: 5px;
            width: 280px;
            height: 280px;
            margin: 30px auto;
        }
        button {
            font-size: 36px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #up { grid-area: up; }
        #left { grid-area: left; }
        #right { grid-area: right; }
        #down { grid-area: down; }
        #winMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #90EE90, #7CFC00);
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 100;
            text-align: center;
            display: none;
            max-width: 90vw;
        }
        #winMessage h1 { font-size: 48px; color: #228B22; margin: 0 0 20px 0; }
        #winMessage p { font-size: 32px; margin: 10px 0; }
        #winMessage button {
            font-size: 32px;
            width: 300px;
            height: 80px;
            border-radius: 40px;
            margin-top: 20px;
            background: linear-gradient(145deg, #FF6B35, #F7931E);
        }
        @media (max-width: 600px) {
            #header h2 { font-size: 24px; }
            #levelInfo { font-size: 22px; }
            button { font-size: 28px; width: 70px; height: 70px; }
            #controls { width: 220px; height: 220px; }
            #winMessage h1 { font-size: 36px; }
            #winMessage p { font-size: 24px; }
            #winMessage button { font-size: 24px; width: 250px; height: 60px; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h2>🐻 Лабіринт Ведмедика → 🍯</h2>
        <div id="levelInfo">Рівень: <span id="levelNum">1</span></div>
        <p style="font-size: 24px; margin: 10px 0 0 0;">Керуй стрілками або кнопками!</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="controls">
        <button id="up" onclick="movePlayer(-1, 0)">↑</button>
        <button id="left" onclick="movePlayer(0, -1)">←</button>
        <button id="right" onclick="movePlayer(0, 1)">→</button>
        <button id="down" onclick="movePlayer(1, 0)">↓</button>
    </div>
    <div id="winMessage">
        <h1>🎉 Вітаю! 🎉</h1>
        <p>Рівень <span id="finalLevel"></span> пройдено!</p>
        <button onclick="nextLevel()">Наступний рівень! 🚀</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelNumElement = document.getElementById('levelNum');
        const winMessage = document.getElementById('winMessage');
        const finalLevelElement = document.getElementById('finalLevel');

        let rows, cols, cellSize, maze, player, goal;
        let level = 1;
        let gameWon = false;

        function generateMaze(w, h) {
            const newMaze = Array.from({length: h}, () => Array(w).fill(1));
            const stack = [];
            let x = 1, y = 1;
            newMaze[y][x] = 0;
            stack.push([x, y]);

            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                x = current[0];
                y = current[1];

                const neighbors = [];
                if (x > 1 && newMaze[y][x - 2] === 1) neighbors.push([x - 2, y]);
                if (x < w - 2 && newMaze[y][x + 2] === 1) neighbors.push([x + 2, y]);
                if (y > 1 && newMaze[y - 2][x] === 1) neighbors.push([x, y - 2]);
                if (y < h - 2 && newMaze[y + 2][x] === 1) neighbors.push([x, y + 2]);

                if (neighbors.length > 0) {
                    const nextIdx = Math.floor(Math.random() * neighbors.length);
                    const [nx, ny] = neighbors[nextIdx];
                    const wx = (x + nx) / 2;
                    const wy = (y + ny) / 2;
                    newMaze[wy][wx] = 0;
                    newMaze[ny][nx] = 0;
                    stack.push([nx, ny]);
                } else {
                    stack.pop();
                }
            }

            // Відкриваємо вхід та вихід
            newMaze[0][0] = 0;
            newMaze[0][1] = 0;
            newMaze[h - 1][w - 1] = 0;
            newMaze[h - 1][w - 2] = 0;
            return newMaze;
        }

        function initLevel() {
            const maxDim = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.6);
            const minCellSize = 22;
            const size = Math.min(11 + (level - 1) * 2, 45); // Ріст розміру з рівнем: 11,13,...,45
            cellSize = Math.max(minCellSize, Math.floor(maxDim / size));
            cols = size;
            rows = size;
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
            canvas.style.width = canvas.width + 'px';
            canvas.style.height = canvas.height + 'px';

            maze = generateMaze(cols, rows);
            player = { row: 0, col: 0 };
            goal = { row: rows - 1, col: cols - 1 };
            gameWon = false;
            levelNumElement.textContent = level;
            update();
        }

        function drawMaze() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    ctx.fillStyle = maze[r][c] === 1 ? '#333' : '#F0F8FF';
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                    ctx.strokeStyle = '#DDD';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
        }

       // Картинка гравця (підгружається один раз)
const playerImage = new Image();
playerImage.src = 'https://humansecuritynow.org/wp-content/uploads/2025/12/332.png';

function drawPlayer() {
    // якщо картинка ще не завантажилась — нічого не малюємо
    if (!playerImage.complete) return;

    ctx.drawImage(
        playerImage,
        player.col * cellSize,
        player.row * cellSize,
        cellSize,
        cellSize
    );
}


        function drawGoal() {
            ctx.save();
            ctx.font = `${cellSize * 0.85}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🍯', goal.col * cellSize + cellSize / 2, goal.row * cellSize + cellSize / 2);
            ctx.restore();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMaze();
            drawGoal();
            drawPlayer();
        }

        function movePlayer(drow, dcol) {
            if (gameWon) return;
            const newRow = player.row + drow;
            const newCol = player.col + dcol;
            if (newRow >= 0 && newRow < rows && newCol >= 0 && newCol < cols && maze[newRow][newCol] === 0) {
                player.row = newRow;
                player.col = newCol;
                update();
                if (player.row === goal.row && player.col === goal.col) {
                    gameWon = true;
                    finalLevelElement.textContent = level;
                    winMessage.style.display = 'block';
                }
            }
        }

        function nextLevel() {
            level++;
            winMessage.style.display = 'none';
            initLevel();
        }

        // Клавіатура
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            switch (e.key) {
                case 'ArrowUp': movePlayer(-1, 0); break;
                case 'ArrowDown': movePlayer(1, 0); break;
                case 'ArrowLeft': movePlayer(0, -1); break;
                case 'ArrowRight': movePlayer(0, 1); break;
            }
        });

        // Ініціалізація першого рівня
        initLevel();
    </script>
</body>
</html>
