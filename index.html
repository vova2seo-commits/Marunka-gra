<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Jump - Гра для малюків</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #87CEEB; font-family: Arial, sans-serif; }
        canvas { border: 2px solid #000; background: #90EE90; }
        #score { position: absolute; top: 10px; left: 10px; font-size: 24px; color: #000; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
        #gameOver h1 { font-size: 36px; color: red; }
        #gameOver button { font-size: 24px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="score">Рахунок: 0</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="gameOver">
        <h1>Маринка шо з зайцем?</h1>
        <p>Твій рахунок: <span id="finalScore"></span></p>
        <button onclick="restartGame()">Спробуй ще!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        let bunny = { x: 50, y: 300, width: 50, height: 50, velocity: 0, gravity: 1, jump: -20 };
        let obstacles = [];
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;

        function drawBunny() {
            ctx.font = '50px Arial';
            ctx.fillText('🐰', bunny.x, bunny.y);
        }

        function drawObstacle(obstacle) {
            ctx.font = '50px Arial';
            ctx.fillText('🌳', obstacle.x, obstacle.y);
        }

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Гравітація і стрибок
            bunny.velocity += bunny.gravity;
            bunny.y += bunny.velocity;
            if (bunny.y > 300) bunny.y = 300; // Підлога

            drawBunny();

            // Перешкоди
            if (Math.random() < 0.02) { // Шанс створення нової перешкоди
                obstacles.push({ x: canvas.width, y: 300, width: 50, height: 50 });
            }

            obstacles.forEach((obs, index) => {
                obs.x -= gameSpeed;
                drawObstacle(obs);
                if (obs.x < -obs.width) obstacles.splice(index, 1);

                // Колізія
                if (bunny.x + bunny.width > obs.x && bunny.x < obs.x + obs.width &&
                    bunny.y + bunny.height > obs.y && bunny.y < obs.y + obs.height) {
                    endGame();
                }
            });

            score++;
            scoreElement.textContent = 'Рахунок: ' + Math.floor(score / 10);
            requestAnimationFrame(update);
        }

        function jump() {
            if (bunny.y === 300) bunny.velocity = bunny.jump;
        }

        function endGame() {
            isGameOver = true;
            finalScoreElement.textContent = Math.floor(score / 10);
            gameOverElement.style.display = 'block';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            obstacles = [];
            bunny.y = 300;
            bunny.velocity = 0;
            gameOverElement.style.display = 'none';
            update();
        }

        document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
        canvas.addEventListener('touchstart', jump); // Для мобілок

        update();
    </script>
</body>
</html>
